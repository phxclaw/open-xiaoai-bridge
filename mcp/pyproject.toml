[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-xiaoai-mcp"
version = "0.1.0"
description = "MCP server for the Open XiaoAI speaker bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open XiaoAI contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
open-xiaoai-mcp = "open_xiaoai_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_xiaoai_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["open_xiaoai_mcp"]
